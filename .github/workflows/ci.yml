# The gate on every push and pull request, on the three systems tend is
# built for. Linux runs `make check` — gofmt, vet, the tests and the tests
# under the race detector — as a commit must pass locally, and decides the
# run. macOS and Windows must build and vet; their tests run too, and what
# they say is in the job's steps, but it does not decide the run: when this
# workflow was first run, sixteen tests failed on macOS (most read /proc, or
# want a keyring, or a socket path the Mac's 104-byte limit refuses) and
# about eighty on Windows (written for unix shells and ptys). A run red for
# them every time would say nothing about the push that started it. Only
# GitHub's own actions are used, so no third party sees the repository.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch makes the run before it moot.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: check (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Gate (gofmt, vet, tests, race)
        run: make check
  others:
    name: build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests (not yet all passing here)
        continue-on-error: true
        run: go test ./...
