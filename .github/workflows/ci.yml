# The gate on every push and pull request, on the three systems tend is
# built for. Linux and macOS run `make check` — gofmt, vet, the tests and the
# tests under the race detector — as a commit must pass locally. Windows has
# no make and most end-to-end tests need a unix pty, so it builds, vets and
# runs the tests that build there. Only GitHub's own actions are used, so no
# third party sees the repository.
name: CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  # A newer push to the same branch makes the run before it moot.
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: make check
  windows:
    name: build (windows)
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Tests
        run: go test ./...
